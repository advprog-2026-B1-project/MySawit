spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-id
            client-secret: dummy-secret
            scope: email, profile

supabase:
  url: ${SUPABASE_URL:http://localhost-dummy}
  key: ${SUPABASE_KEY:dummy-key}
  bucket: ${SUPABASE_BUCKET:dummy-bucket}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: MySawit
    version: 1.0.0
    description: Platform Manajemen Kebun Sawit

mysawit:
  features:
    delivery-enabled: ${MYSAWIT_DELIVERY_ENABLED:true}
